
<!DOCTYPE html>

    <script>
      /* INLOGGNINGENS ENKLA VÄG.
         Anropen till Googles inloggningsserver skickas normalt med rubriker som
         tvingar webbläsaren att ställa en förhandsfråga (CORS preflight) först.
         Webbläsaren i vissa pekskärmar hänger sig på den — inloggningen dör med
         nätverksfel fast servern nås utmärkt. Här skalas rubrikerna av så att
         anropet går i enkel form utan förhandsfråga. Verifierat mot servern:
         den läser och besvarar anropen precis likadant.
         Ligger här, först av allt, så att ingen annan kod hinner greppa
         nätverksvägen innan förenklingen är på plats. */
      /* Skärmar som behövt reservinloggningen är gamla webbläsare med svag
         grafik. De märker sig själva, och CSS:en och animationerna anpassar
         sig — suddiga glasytor och glidande övergångar är det som gör att
         tillbaka-klick känns sega på dem. */
      /* Starttidslinjen. Varje steg i uppstarten bokför sig här, räknat från
         första millisekunden. Visas under laddningsloggan när starten är seg,
         så att den långsamma länken pekar ut sig själv. */
      window.__starttid = Date.now();
      window.__bootlogg = [];
      window.__bootmark = function (namn) {
        try { window.__bootlogg.push(namn + ' ' + (Date.now() - window.__starttid) + 'ms'); } catch (e) {}
      };
      try {
        if (localStorage.getItem('smartstudio-reservinloggning') === '1') {
          document.documentElement.className += ' enkel-grafik';
        }
      } catch (e) {}
      (function () {
        if (!window.fetch) return;
        var vanlig = window.fetch.bind(window);
        window.__enkelInloggningsvag = true;
        window.__inloggningslogg = [];
        function bokfor(rad) {
          try {
            window.__inloggningslogg.push(rad);
            if (window.__inloggningslogg.length > 6) window.__inloggningslogg.shift();
          } catch (e) {}
        }
        function delAv(url) {
          try { return url.split('?')[0].split('/').slice(-1)[0].slice(0, 40); } catch (e) { return '?'; }
        }
        window.fetch = function (input, init) {
          var url = '';
          try { url = typeof input === 'string' ? input : (input && input.url) || ''; } catch (e) {}
          var arGoogle = url.indexOf('googleapis.com') !== -1;
          var arInloggning = url.indexOf('identitytoolkit.googleapis.com') !== -1;
          var start = Date.now();
          var p;
          try {
            if (arInloggning) {
              var method = (init && init.method) || (input && input.method) || 'GET';
              var body = init ? init.body : undefined;
              p = body === undefined ? vanlig(url, { method: method }) : vanlig(url, { method: method, body: body });
            } else {
              p = vanlig(input, init);
            }
          } catch (e) {
            if (arGoogle) bokfor(delAv(url) + ' KAST:' + String(e).slice(0, 60) + ' ' + (Date.now() - start) + 'ms');
            throw e;
          }
          if (arGoogle && p && p.then) {
            p.then(function (r) {
              bokfor(delAv(url) + ' ' + r.status + ' ' + (Date.now() - start) + 'ms');
            }, function (e) {
              bokfor(delAv(url) + ' FEL:' + String(e).slice(0, 60) + ' ' + (Date.now() - start) + 'ms');
            });
          }
          return p;
        };
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartStudio</title>
